<!doctype html>
<html lang="en" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ANMC 2026 — Badge Collection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--navy:#12356b;--ok:#0a7d33;--warn:#b26a00;--red:#c0392b;--line:#2E3440;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#0f131a;color:#fff;}
  header{background:var(--navy);padding:14px 16px;text-align:center}
  header h1{margin:0;font-size:16px;font-weight:700}
  header p{margin:3px 0 0;font-size:12px;color:#aebfe0}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  .card{background:#1a1f29;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#232a36;color:#fff;font:inherit;margin-bottom:10px}
  button{width:100%;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font:inherit;cursor:pointer}
  button.ghost{background:#232a36;border:1px solid var(--line)}
  .err{color:#ff6b6b;font-size:13px;min-height:16px;margin-top:4px}
  #reader{width:100%;border-radius:12px;overflow:hidden}
  .result{border-radius:14px;padding:22px 16px;text-align:center;margin-bottom:14px;display:none}
  .result.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:scale(1);opacity:1}}
  .result .big{font-size:40px;line-height:1;margin-bottom:8px}
  .result .nm{font-size:22px;font-weight:800;margin:4px 0}
  .result .id{font-size:14px;opacity:.85;letter-spacing:.5px}
  .result .sub{font-size:13px;margin-top:8px;opacity:.9}
  .r-ok{background:#0e3d20;border:2px solid var(--ok)}
  .r-already{background:#4a3410;border:2px solid var(--warn)}
  .r-no{background:#4a1515;border:2px solid var(--red)}
  .prog .ptop{font-size:15px;text-align:center;margin-bottom:10px}
  .prog .ptop b{color:#7fd6a0;font-size:20px}
  .prog .bar{height:18px;background:#232a36;border-radius:10px;overflow:hidden}
  .prog .fill{height:100%;width:0;background:linear-gradient(90deg,#0a7d33,#3ac07a);transition:width .5s ease}
  .prog .pbot{font-size:12.5px;color:#9AA4B2;text-align:center;margin-top:9px}
  .prog .pbot b{color:#fff}
  .prog .cheer{text-align:center;font-weight:800;color:#7fd6a0;margin-top:8px;min-height:20px;font-size:14px}
  .manual{display:flex;gap:8px}.manual input{margin:0}.manual button{width:auto;padding:12px 16px}
  .sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#232a36}
  .sr .n{font-weight:700;font-size:14px}
  .sr .c{font-size:11px;color:#9AA4B2}
  .sr .got{font-size:11px;color:#7fd6a0}
  .sr button{width:auto;padding:9px 14px;background:var(--ok)}
  .hidden{display:none!important}
  .muted{color:#9AA4B2;font-size:12px;text-align:center;margin-top:6px}
</style></head>
<body>
<header>
  <h1>ANMC 2026 — Badge Collection</h1>
  <p>Badge Collection Scanner</p>
</header>

<div class="wrap">

  <!-- SCANNER (no login — opens directly) -->
  <div id="scanPane">
    <div class="card" id="whoCard">
      <label style="display:block;font-size:12px;color:#9AA4B2;margin-bottom:6px">Volunteer name (saved with each badge)</label>
      <div class="manual">
        <input id="who" placeholder="Enter your name">
        <button id="whoBtn">Save</button>
      </div>
      <div class="muted" id="whoMsg" style="text-align:left"></div>
    </div>

    <div class="card prog">
      <div class="ptop"><b id="pCollected">—</b> of <span id="pTotal">—</span> badges collected</div>
      <div class="bar"><div id="barFill" class="fill"></div></div>
      <div class="pbot">Remaining <b id="pRemain">—</b> · This session <b id="cntSession">0</b></div>
      <div class="cheer" id="cheer"></div>
    </div>

    <div class="result" id="result"></div>

    <div class="card">
      <div id="reader"></div>
      <div class="muted" id="camMsg">Point the camera at the QR</div>
    </div>

    <div class="card">
      <div class="manual">
        <input id="manual" placeholder="Or type the registration ID">
        <button id="manualBtn">Confirm</button>
      </div>
    </div>

    <div class="card">
      <div class="manual">
        <input id="search" placeholder="Search by name (if QR not found)">
        <button id="searchBtn">Search</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

</div>

<script>
const CFG={
  URL:"https://xmdkvxzflbbdnkwsggjm.supabase.co",
  ANON:"sb_publishable_5UXQ_sYU5KOnRob11-ic1g_VtjUhXP8",
  TABLE:"registrations"
};
const $=id=>document.getElementById(id);
let TOKEN=null, sessionCount=0, busy=false, lastCode="", lastAt=0, volunteer="";

async function api(path,opts={}){
  opts.headers=Object.assign({apikey:CFG.ANON,Authorization:'Bearer '+(TOKEN||CFG.ANON),'Content-Type':'application/json'},opts.headers||{});
  return fetch(CFG.URL+'/'+path,opts);
}

/* ---- volunteer name ---- */
try{ volunteer=localStorage.getItem('anmc_volunteer')||''; }catch(_){}
function setWho(){
  volunteer=$('who').value.trim();
  try{ localStorage.setItem('anmc_volunteer',volunteer); }catch(_){}
  $('whoMsg').textContent=volunteer?('✓ Saved: '+volunteer):'';
}
$('whoBtn').onclick=setWho;
$('who').addEventListener('keydown',e=>{if(e.key==='Enter')setWho();});

/* ---- progress (collected / total / remaining) ---- */
let ST={total:0,collected:0};
function renderStats(){
  const t=ST.total||0, c=ST.collected||0, rem=Math.max(t-c,0);
  $('pCollected').textContent=c; $('pTotal').textContent=t||'—'; $('pRemain').textContent=t?rem:'—';
  const pct=t?Math.round(c/t*100):0;
  $('barFill').style.width=pct+'%';
  let msg='';
  if(t){
    if(c>=t) msg='🎉 All done! Great work, team 👏';
    else if(pct>=90) msg='🔥 Only '+rem+' left — almost there!';
    else if(pct>=75) msg='💪 Excellent! '+pct+'% done';
    else if(pct>=50) msg='✨ Halfway there! Keep going';
    else if(pct>=25) msg='👍 Great start — let’s keep going';
  }
  $('cheer').textContent=msg;
}
async function refreshTotal(){
  try{
    const r=await api('rest/v1/rpc/badge_stats',{method:'POST',body:'{}'});
    const d=await r.json();
    if(r.ok && d){ ST.total=d.total||0; ST.collected=d.collected||0; renderStats(); }
  }catch(_){}
}

/* ---- collect ---- */
function beep(ok){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:300;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close();},ok?140:320);}catch(_){}
  if(navigator.vibrate)navigator.vibrate(ok?80:[90,60,90]);
}
function showResult(cls,big,nm,id,sub){
  const r=$('result'); r.className='result show '+cls;
  r.innerHTML='<div class="big">'+big+'</div>'+(nm?'<div class="nm">'+esc(nm)+'</div>':'')+(id?'<div class="id">'+esc(id)+'</div>':'')+(sub?'<div class="sub">'+esc(sub)+'</div>':'');
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function collect(code){
  code=(code||'').trim(); if(!code||busy)return;
  if(!volunteer){ showResult('r-already','✎','Enter your name first','','Fill the "Volunteer name" field above and save'); beep(false); return; }
  // debounce same code within 3s
  const now=Date.now(); if(code===lastCode && now-lastAt<3000)return; lastCode=code;lastAt=now;
  busy=true;
  try{
    const r=await api('rest/v1/rpc/collect_badge',{method:'POST',body:JSON.stringify({p_code:code,p_by:volunteer})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||d.hint||'Error');
    if(d.status==='ok'){
      sessionCount++; $('cntSession').textContent=sessionCount;
      ST.collected=(ST.collected||0)+1; renderStats();
      showResult('r-ok','✓','Badge issued',d.id,d.name||''); beep(true);
    }else if(d.status==='already'){
      const when=d.at?new Date(d.at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      showResult('r-already','⚠',d.name||'','',(d.id?d.id+' · ':'')+'Already collected'+(when?' — '+when:'')); beep(false);
    }else{
      showResult('r-no','✕','Not found',code,'ID is not in the database'); beep(false);
    }
  }catch(ex){
    showResult('r-no','✕','Error',code,String(ex.message)); beep(false);
  }finally{ busy=false; }
}

$('manualBtn').onclick=()=>{ collect($('manual').value); $('manual').value=''; };
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')$('manualBtn').click();});

/* ---- camera ---- */
function startCam(){
  const q=new Html5Qrcode("reader"); window.__qr=q;
  q.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},
    txt=>collect(txt),
    ()=>{}
  ).then(()=>{$('camMsg').textContent='Ready — point the camera at the QR';})
   .catch(e=>{$('camMsg').textContent='Could not open the camera (open the page over HTTPS). You can use manual entry.';});
}

/* ---- search by name (for mismatched/old QR) ---- */
async function doSearch(){
  const q=$('search').value.trim(); const box=$('searchResults');
  if(q.length<2){ box.innerHTML='<div class="muted">Type at least 2 letters</div>'; return; }
  box.innerHTML='<div class="muted">Searching…</div>';
  try{
    const r=await api('rest/v1/rpc/badge_search',{method:'POST',body:JSON.stringify({q:q})});
    const list=await r.json();
    if(!r.ok) throw new Error(list.message||'error');
    if(!list.length){ box.innerHTML='<div class="muted">No match</div>'; return; }
    box.innerHTML='';
    list.forEach(p=>{
      const row=document.createElement('div'); row.className='sr';
      row.innerHTML='<div><div class="n">'+esc(p.name)+'</div><div class="c">'+esc(p.id)+' · '+esc(p.category||'')+(p.collected?' · <span class="got">already collected</span>':'')+'</div></div>';
      const b=document.createElement('button'); b.textContent=p.collected?'Collected':'Give badge';
      if(p.collected){ b.disabled=true; b.style.opacity=.6; }
      b.onclick=()=>{ collect(p.id); box.innerHTML=''; $('search').value=''; };
      row.appendChild(b); box.appendChild(row);
    });
  }catch(ex){ box.innerHTML='<div class="muted">Error — try again</div>'; }
}
$('searchBtn').onclick=doSearch;
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

/* ---- auto start (no login) ---- */
if(volunteer){ $('who').value=volunteer; $('whoMsg').textContent='✓ Saved: '+volunteer; }
refreshTotal();
startCam();
</script>
</body></html>
