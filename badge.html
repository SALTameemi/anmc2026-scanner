<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ANMC 2026 — استلام البادج</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--navy:#12356b;--ok:#0a7d33;--warn:#b26a00;--red:#c0392b;--line:#2E3440;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#0f131a;color:#fff;}
  header{background:var(--navy);padding:14px 16px;text-align:center}
  header h1{margin:0;font-size:16px;font-weight:700}
  header p{margin:3px 0 0;font-size:12px;color:#aebfe0}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  .card{background:#1a1f29;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#232a36;color:#fff;font:inherit;margin-bottom:10px}
  button{width:100%;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font:inherit;cursor:pointer}
  button.ghost{background:#232a36;border:1px solid var(--line)}
  .err{color:#ff6b6b;font-size:13px;min-height:16px;margin-top:4px}
  #reader{width:100%;border-radius:12px;overflow:hidden}
  .result{border-radius:14px;padding:22px 16px;text-align:center;margin-bottom:14px;display:none}
  .result.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:scale(1);opacity:1}}
  .result .big{font-size:40px;line-height:1;margin-bottom:8px}
  .result .nm{font-size:22px;font-weight:800;margin:4px 0}
  .result .id{font-size:14px;opacity:.85;letter-spacing:.5px}
  .result .sub{font-size:13px;margin-top:8px;opacity:.9}
  .r-ok{background:#0e3d20;border:2px solid var(--ok)}
  .r-already{background:#4a3410;border:2px solid var(--warn)}
  .r-no{background:#4a1515;border:2px solid var(--red)}
  .stats{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:#1a1f29;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px;color:#7fd6a0}
  .stat span{font-size:11px;color:#9AA4B2}
  .manual{display:flex;gap:8px}.manual input{margin:0}.manual button{width:auto;padding:12px 16px}
  .hidden{display:none!important}
  .muted{color:#9AA4B2;font-size:12px;text-align:center;margin-top:6px}
</style></head>
<body>
<header>
  <h1>ANMC 2026 — استلام البادج</h1>
  <p>Badge Collection Scanner</p>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <input id="email" type="email" value="badgedesk@anmc2026.qa" autocomplete="username">
    <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <button id="loginBtn">تسجيل الدخول</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- SCANNER -->
  <div id="scanPane" class="hidden">
    <div class="card" id="whoCard">
      <label style="display:block;font-size:12px;color:#9AA4B2;margin-bottom:6px">اسم المتطوع (يُسجّل مع كل بادج)</label>
      <div class="manual">
        <input id="who" placeholder="اكتب اسمك">
        <button id="whoBtn">حفظ</button>
      </div>
      <div class="muted" id="whoMsg" style="text-align:right"></div>
    </div>

    <div class="stats">
      <div class="stat"><b id="cntSession">0</b><span>استلموا (هذي الجلسة)</span></div>
      <div class="stat"><b id="cntTotal">—</b><span>إجمالي استلموا</span></div>
    </div>

    <div class="result" id="result"></div>

    <div class="card">
      <div id="reader"></div>
      <div class="muted" id="camMsg">وجّهي الكاميرا على الـ QR</div>
    </div>

    <div class="card">
      <div class="manual">
        <input id="manual" placeholder="أو اكتبي رقم التسجيل يدوياً">
        <button id="manualBtn">تأكيد</button>
      </div>
    </div>

    <button class="ghost" id="logout">تسجيل خروج</button>
  </div>

</div>

<script>
const CFG={
  URL:"https://xmdkvxzflbbdnkwsggjm.supabase.co",
  ANON:"sb_publishable_5UXQ_sYU5KOnRob11-ic1g_VtjUhXP8",
  TABLE:"registrations"
};
const $=id=>document.getElementById(id);
let TOKEN=null, sessionCount=0, busy=false, lastCode="", lastAt=0, volunteer="";

async function api(path,opts={}){
  opts.headers=Object.assign({apikey:CFG.ANON,Authorization:'Bearer '+(TOKEN||CFG.ANON),'Content-Type':'application/json'},opts.headers||{});
  return fetch(CFG.URL+'/'+path,opts);
}

/* ---- login ---- */
$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim(), pw=$('pass').value, e=$('loginErr'); e.textContent='';
  if(!email||!pw){e.textContent='أدخلي الإيميل وكلمة السر';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='...';
  try{
    const r=await fetch(CFG.URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.ANON,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error_description||d.msg||'فشل الدخول');
    TOKEN=d.access_token;
    $('loginCard').classList.add('hidden'); $('scanPane').classList.remove('hidden');
    if(volunteer){ $('who').value=volunteer; $('whoMsg').textContent='✓ محفوظ: '+volunteer; }
    refreshTotal(); startCam();
  }catch(ex){e.textContent=String(ex.message).includes('Invalid')?'إيميل أو كلمة سر غير صحيحة':ex.message;}
  finally{$('loginBtn').disabled=false;$('loginBtn').textContent='تسجيل الدخول';}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});

$('logout').onclick=()=>{ try{if(window.__qr)window.__qr.stop();}catch(_){ } location.reload(); };

/* ---- volunteer name ---- */
try{ volunteer=localStorage.getItem('anmc_volunteer')||''; }catch(_){}
function setWho(){
  volunteer=$('who').value.trim();
  try{ localStorage.setItem('anmc_volunteer',volunteer); }catch(_){}
  $('whoMsg').textContent=volunteer?('✓ محفوظ: '+volunteer):'';
}
$('whoBtn').onclick=setWho;
$('who').addEventListener('keydown',e=>{if(e.key==='Enter')setWho();});

/* ---- total collected count ---- */
async function refreshTotal(){
  try{
    const r=await api('rest/v1/'+CFG.TABLE+'?select=registrant_id&badge_collected=is.true',{headers:{'Prefer':'count=exact','Range':'0-0','Range-Unit':'items'}});
    const cr=r.headers.get('content-range'); // e.g. 0-0/42
    const total=cr&&cr.includes('/')?cr.split('/')[1]:'—';
    $('cntTotal').textContent=total;
  }catch(_){}
}

/* ---- collect ---- */
function beep(ok){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:300;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close();},ok?140:320);}catch(_){}
  if(navigator.vibrate)navigator.vibrate(ok?80:[90,60,90]);
}
function showResult(cls,big,nm,id,sub){
  const r=$('result'); r.className='result show '+cls;
  r.innerHTML='<div class="big">'+big+'</div>'+(nm?'<div class="nm">'+esc(nm)+'</div>':'')+(id?'<div class="id">'+esc(id)+'</div>':'')+(sub?'<div class="sub">'+esc(sub)+'</div>':'');
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function collect(code){
  code=(code||'').trim(); if(!code||busy)return;
  if(!volunteer){ showResult('r-already','✎','اكتب اسمك أول','','املأ خانة "اسم المتطوع" فوق ثم احفظ'); beep(false); return; }
  // debounce same code within 3s
  const now=Date.now(); if(code===lastCode && now-lastAt<3000)return; lastCode=code;lastAt=now;
  busy=true;
  try{
    const r=await api('rest/v1/rpc/collect_badge',{method:'POST',body:JSON.stringify({p_code:code,p_by:volunteer})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||d.hint||'خطأ');
    if(d.status==='ok'){
      sessionCount++; $('cntSession').textContent=sessionCount;
      $('cntTotal').textContent=(parseInt($('cntTotal').textContent)||0)+1;
      showResult('r-ok','✓','تم تسليم البادج',d.id,d.name||''); beep(true);
    }else if(d.status==='already'){
      const when=d.at?new Date(d.at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      showResult('r-already','⚠',d.name||'','',(d.id?d.id+' · ':'')+'استلم مسبقاً'+(when?' — '+when:'')); beep(false);
    }else{
      showResult('r-no','✕','غير موجود',code,'الرقم مو في القاعدة'); beep(false);
    }
  }catch(ex){
    showResult('r-no','✕','خطأ',code,String(ex.message)); beep(false);
  }finally{ busy=false; }
}

$('manualBtn').onclick=()=>{ collect($('manual').value); $('manual').value=''; };
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')$('manualBtn').click();});

/* ---- camera ---- */
function startCam(){
  const q=new Html5Qrcode("reader"); window.__qr=q;
  q.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},
    txt=>collect(txt),
    ()=>{}
  ).then(()=>{$('camMsg').textContent='جاهز — وجّهي الكاميرا على الـ QR';})
   .catch(e=>{$('camMsg').textContent='تعذّر فتح الكاميرا (افتحي الصفحة من رابط HTTPS). تقدرين تستخدمين الإدخال اليدوي.';});
}
</script>
</body></html>
